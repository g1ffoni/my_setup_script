[main]
namespace=fuzzel
font=Adwaita Sans
prompt=" >>> "
terminal=foot -a '{cmd}' -T '{cmd}' {cmd}
lines=6
hide-prompt=no
width=40
horizontal-pad=40
vertical-pad=20
line-height=30

anchor=center

[colors]
background=343437FF
text=FFFFFFFF
message=FFFFFFFF
prompt=FFFFFFFF
placeholder=FFFFFFFF
input=FFFFFFFF
match=81D0FFFF
selection=FFFFFF08
selection-text=FFFFFFFF
selection-match=81D0FFFF
counter=93a1a1ff
border=7F8C98FF

[border]
width=2
radius=0
selection-radius=0
